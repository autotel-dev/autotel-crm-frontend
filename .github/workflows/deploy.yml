name: CI/CD Frontend Deploy

on:
  push:
    branches:
      - frontend/bilal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment on server
        uses: appleboy/ssh-action@v1.2.0   # ⬅ upgrade version
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 5768
          script_stop: true         # stop if any command fails on server
          timeout: 30m              # now actually works
          script: |
            /root/deploy.sh
