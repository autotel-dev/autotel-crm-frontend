name: CI/CD Frontend Deploy

# Deploys to VM1 on every push to frontend/bilal.
# The SSH key in DEPLOY_KEY is locked on the server (authorized_keys
# "restrict,command=...") so it can only start /root/deploy.sh, which pulls
# frontend/bilal from autotel-dev, builds, and publishes to /var/www/frontend-bilal.
# Needed repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY.
# Deploy log on the server: /var/log/frontend-deploy.log

on:
  push:
    branches:
      - frontend/bilal
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start deploy on VM1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 5768
          timeout: 1m
          # The server ignores this and runs its fixed deploy command.
          script: deploy
